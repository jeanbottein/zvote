spring:
  application:
    name: zvote-server

  # Blocking code on virtual threads: request handling reads top to bottom,
  # stack traces point at our own code, and @Transactional means what everyone
  # thinks it means - while the server still holds many concurrent connections,
  # including the long-lived live-results streams.
  threads:
    virtual:
      enabled: true

  # H2 in file mode: embedded, so there is no database server, no port and no
  # credentials. The data is one file under the data directory, which keeps the
  # repo folder self-contained and portable across machines.
  #
  # ./dev.sh exports ZVOTE_DATA_DIR as an absolute path. The fallback uses
  # ${user.dir} rather than "./data" because H2 rejects implicitly relative paths.
  #
  # Deliberately no DATABASE_TO_LOWER and no MODE=PostgreSQL: both break the
  # identifier-case agreement between the schema and Spring Data (see
  # V1__init.sql), and MODE=PostgreSQL also makes Spring Data pick the wrong
  # dialect.
  datasource:
    url: jdbc:h2:file:${ZVOTE_DATA_DIR:${user.dir}/data}/zvote;AUTO_SERVER=TRUE
    username: sa
    password:

# What this server offers. Advertised at GET /api/server-info so the client can
# adapt its UI, and enforced when polls are created.
zvote:
  features:
    # Off until accounts arrive: a listed poll will need a signed-in creator.
    public-polls: false
    unlisted-polls: true
    approval-voting: true
    majority-judgment: true
  limits:
    max-options: 20
    max-title-length: 200
    max-option-length: 100
    max-voter-name-length: 40
    # Per poll. Links are signed, not stored: a billion cost what one does.
    max-invitations: 1000
    # Polls are for deciding, not archiving: keeping them briefly keeps little
    # personal data (voter names) around.
    poll-lifetime-days: 30

  # Where people reach this server's polls, without a trailing slash: share
  # links and invitation links are built from it, for clients that cannot know
  # their own address (an agent) or run on another one (a packaged app). In
  # development the app is the Vite server, which proxies /api here.
  public-url: ${ZVOTE_PUBLIC_URL:http://localhost:5173}

  # Keys who owns each ballot, so that the database never says (see Voter.java),
  # and signs invitation links (InvitationLinks.java). No default: a server must
  # not run on a secret everyone can read here. ./mvnw spring-boot:run (and so
  # ./dev.sh) sets a development one, in pom.xml. Never change it while polls
  # are open: their voters would be told they have not voted, voting again
  # would count them twice, and their invitation links would stop working.
  voter-secret: ${ZVOTE_VOTER_SECRET:}

# The same services as tools, for an agent (org.zvote.server.api.mcp).
# Stateless: a tool call is one request in and one answer out, on a virtual
# thread, with nothing kept between them - so any instance can answer, and no
# call costs more because a poll is large. It is served under /api, where
# VoterIdentityFilter resolves the caller: an agent sends its voter token as
# "Authorization: Bearer <token>", exactly as it would to the HTTP API.
spring.ai.mcp.server:
  name: zvote
  version: 0.1.0
  type: SYNC
  protocol: STATELESS
  streamable-http:
    mcp-endpoint: /api/mcp
